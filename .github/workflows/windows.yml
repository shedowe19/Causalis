name: Chromium Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Chromium Windows x64 (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed.' }
      - name: Check source and credential regressions
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Syntax checks failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
      - name: Prepare verified official CLI for tests
        run: |
          npm run prepare:client
          if ($LASTEXITCODE -ne 0) { throw 'Official CLI verification failed.' }
          $env:BITWARDENCLI_APPDATA_DIR = Join-Path $env:RUNNER_TEMP 'causalis-cli-version'
          & ./vendor/client/bw.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Official CLI could not start.' }
          Remove-Item Env:BITWARDENCLI_APPDATA_DIR
      - name: Test actual development Chromium
        run: |
          $env:CAUSALIS_CI_BW_PATH = (Resolve-Path vendor/client/bw.exe).Path
          $env:CAUSALIS_REPORT_DIR = Join-Path $PWD 'test-results/development'
          & ./tools/run-smoke.ps1 -Executable (Resolve-Path node_modules/electron/dist/electron.exe).Path -ProjectPath "$PWD"
      - name: Package Windows browser
        run: npm run package:windows
      - name: Test the packaged executable
        run: |
          $env:CAUSALIS_CI_BW_PATH = (Resolve-Path vendor/client/bw.exe).Path
          $env:CAUSALIS_REPORT_DIR = Join-Path $PWD 'test-results/packaged'
          & ./tools/run-smoke.ps1 -Executable (Resolve-Path dist/Causalis-win32-x64/Causalis.exe).Path
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify source commit.' }
          "Tested source commit: $commit" | Set-Content dist/Causalis-win32-x64/BUILD.txt
          Get-FileHash dist/Causalis-win32-x64/Causalis.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  Causalis.exe" } | Set-Content dist/Causalis-win32-x64/SHA256SUMS.txt
      - name: Upload browser after successful tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Causalis-Chromium-${{ matrix.runner }}-x64
          path: dist/Causalis-win32-x64/
          retention-days: 14
          if-no-files-found: error
      - name: Upload test reports and Chromium screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Causalis-Chromium-tests-${{ matrix.runner }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
